<!DOCTYPE html>
<html>
<head>
<title>For Emimaal ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff6ec4,#7873f5);
    font-family:Arial,sans-serif;
    overflow:hidden;
}

/* Floating Hearts */
.heart{
    position:absolute;
    color:white;
    opacity:0.7;
    animation:float linear infinite;
}

@keyframes float{
    from{
        transform:translateY(100vh);
    }
    to{
        transform:translateY(-120px);
    }
}

.container{
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(12px);
    padding:30px;
    border-radius:25px;
    text-align:center;
    width:90%;
    max-width:450px;
    color:white;
    box-shadow:0 8px 25px rgba(0,0,0,0.2);
}

img{
    width:100%;
    max-width:300px;
    border-radius:15px;
    margin-bottom:15px;
}

h1{
    margin-bottom:10px;
}

h2{
    margin-bottom:15px;
}

.message-box{
    margin-bottom:20px;
    line-height:1.6;
}

button{
    padding:12px 25px;
    margin:10px;
    border:none;
    border-radius:30px;
    cursor:pointer;
    font-size:16px;
    transition:0.3s;
}

#yesBtn{
    background:#ff4081;
    color:white;
}

#noBtn{
    background:#666;
    color:white;
}

#message{
    margin-top:20px;
    font-size:18px;
    font-weight:bold;
    min-height:30px;
}

.fade{
    animation:fade .4s;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>
</head>

<body>

<div class="container">

<img src="https://prasath2003.github.io/love-site/love.jpg"
alt="Emimaal">

<h1>Hi Emimaal ❤️</h1>

<div class="message-box">
You are one of the most special people in my life. 🌹<br><br>
I made this little website just for you because you deserve something unique. ✨
</div>

<h2>Do you love me? ❤️</h2>

<button id="yesBtn">Yes ❤️</button>
<button id="noBtn">No 💔</button>

<p id="message"></p>

</div>

<script>

// Floating Hearts
for(let i=0;i<30;i++){

    let heart=document.createElement("div");

    heart.innerHTML="❤️";
    heart.className="heart";

    heart.style.left=Math.random()*100+"vw";
    heart.style.fontSize=(15+Math.random()*25)+"px";
    heart.style.animationDuration=(5+Math.random()*6)+"s";

    document.body.appendChild(heart);
}

// YES BUTTON
document.getElementById("yesBtn").onclick=function(){

    document.body.innerHTML=`
    <div style="
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:white;
    padding:20px;
    background:linear-gradient(135deg,#ff6ec4,#7873f5);">

        <h1 style="font-size:55px;">
        ❤️ Thank You ❤️
        </h1>

        <h2 style="margin-top:15px;">
        You just made my day! 🥰
        </h2>

        <p style="
        margin-top:20px;
        font-size:22px;
        max-width:500px;">
        No matter what happens,
        you'll always be special to me. 🌹
        </p>

    </div>`;
};

// NO BUTTON
let moves=0;

const noBtn=document.getElementById("noBtn");
const yesBtn=document.getElementById("yesBtn");
const msg=document.getElementById("message");

const messages=[
    "Are you sure? 🥺",
    "Think again ❤️",
    "Really? 😢",
    "The hearts are crying 💔",
    "My code is getting sad 😭",
    "Last chance 😅"
];

function moveButton(){

    if(moves < messages.length){

        msg.innerHTML = messages[moves];
        msg.classList.remove("fade");
        void msg.offsetWidth;
        msg.classList.add("fade");

        noBtn.style.position = "fixed";

        const btnWidth = noBtn.offsetWidth;
        const btnHeight = noBtn.offsetHeight;

        const maxX = window.innerWidth - btnWidth - 20;
        const maxY = window.innerHeight - btnHeight - 20;

        noBtn.style.left = Math.random() * maxX + "px";
        noBtn.style.top = Math.random() * maxY + "px";

        yesBtn.style.transform =
            `scale(${1 + (moves + 1) * 0.15})`;

        moves++;
    }
    else{

        msg.innerHTML =
        "Okay ❤️ Even if you say no, you'll always be special to me 🌹";

        noBtn.innerHTML = "🥺";
        noBtn.style.position = "static";
    }
}

// Desktop
noBtn.addEventListener("mouseover",moveButton);

// Mobile
noBtn.addEventListener("click",moveButton);

</script>

</body>
</html>
